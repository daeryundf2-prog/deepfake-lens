name: deepfake-lens

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly registry/doc link check, Mondays 03:00 UTC.
    - cron: "0 3 * * 1"
  workflow_dispatch:

env:
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (stdlib-only, no optional extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Compile check
        run: python -m compileall deepfake_lens
      - name: Lint (ruff)
        run: |
          python -m pip install ruff
          python -m ruff check deepfake_lens
      # Gradual typing gate — [tool.mypy] files in pyproject.toml are the
      # verified-clean set; the list grows as modules are cleared.
      - name: Type check (mypy, scoped)
        run: |
          python -m pip install mypy
          python -m mypy
      - name: Unit tests (under coverage)
        run: |
          python -m pip install coverage
          python -m coverage run -m unittest discover deepfake_lens/tests -v
      # Coverage gate: this no-extras environment measured 53.57% (2026-10) —
      # much lower than the extras job because optional-dependency modules go
      # largely uncovered here. Gated only on 3.12 so the floor is not at the
      # mercy of interpreter-version coverage drift across the matrix. The
      # extras job enforces pyproject's fail_under instead.
      - name: Coverage report (no-extras floor)
        if: matrix.python-version == '3.12'
        run: python -m coverage report --fail-under=53
      # Benchmark E2E runs only on the committed synthetic fixtures — no
      # external dataset fetch in CI. Real datasets are fetched manually with
      # scripts/fetch_benchmark.py (see its docstring for the manifest format).
      - name: Benchmark E2E (in-tree fixtures)
        env:
          DEEPFAKE_LENS_BENCH_REPORT: benchmark-report.json
        run: python -m unittest deepfake_lens.tests.test_benchmark_e2e -v
      - name: Upload benchmark smoke report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-py${{ matrix.python-version }}
          path: benchmark-report.json
          if-no-files-found: ignore
      - name: CLI help and fixture smoke
        run: python scripts/cli_smoke_test.py

  python-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package (stdlib-only, no optional extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Compile check
        run: python -m compileall deepfake_lens
      # The suite must pass on Windows too: the CLI prints non-ASCII output
      # (Korean labels, em-dashes) and tests must not assume POSIX /tmp.
      - name: Unit tests
        run: python -m unittest discover deepfake_lens/tests

  python-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # The dev extra brings jsonschema (N3: real draft-2020-12 validation of
      # scan/stream payloads in test_json_contract), Pillow and coverage.
      - name: Install with optional extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' numpy scipy opencv-python-headless librosa soundfile scikit-learn
      - name: Unit tests (optional-dependency paths enabled, under coverage)
        run: |
          python -m pip install coverage
          python -m coverage run -m unittest discover deepfake_lens/tests -v
      # The C2PA SDK gates three tests in test_c2pa.py; with the fixture now
      # committed, install the provenance extra so those run in CI too.
      - name: Install provenance extra (c2pa-python)
        run: python -m pip install -e '.[provenance]'
      # -a appends to the coverage data above so the report below measures
      # the same set of tests as the locally-measured 63.59% floor.
      - name: C2PA SDK validation tests
        run: python -m coverage run -a -m unittest deepfake_lens.tests.test_c2pa -v
      # Gate at pyproject [tool.coverage.report] fail_under (63).
      - name: Coverage report (extras floor)
        run: python -m coverage report

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android unit tests
        run: ./gradlew :deepfakeclassifier:testDebugUnitTest --no-daemon

  contract-drift:
    # contracts/ vendors files from lazy-contracts (evidence schema, trust
    # levels, path-confinement helper). PIN.json records their sha256 at the
    # pinned upstream commit; any edit without a matching PIN bump fails
    # here, so re-vendoring is always a deliberate, reviewable change.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify vendored contracts against PIN.json
        run: python scripts/verify_contracts.py
      # models/README.md, models/NOTICE.md and the profile-backed entries of
      # model_registry.py are generated from models/*-runtime.json (G9/G33);
      # a profile edit without regenerating them fails here.
      - name: Model docs generated from profiles
        run: python scripts/sync_model_docs.py --check

  traceability:
    # P12 (round 8): docs/traceability-commits.json + TRACEABILITY-COMMITS.md
    # are rebuilt from `git log <range.base>..<range.head>` (range.head = the
    # parent of the commit that regenerated the table). A hand edit, a
    # history rewrite without regenerating, or a table committed for an
    # older HEAD fails here. Needs the full history, not a shallow clone.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package (stdlib-only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Commit traceability table matches the history
        run: python scripts/build_traceability_commits.py --check

  measurement-gate:
    # Phase 0, WP-I (G26/G28, QA-SYS-9): every runtime profile that is
    # supported (or omits `supported`) must carry a `measured_on` record from
    # the test split of a corpus-manifest-v1 corpus with n_pos/n_neg >= 200
    # and an AUROC 95% CI lower bound >= 0.85 (text: recall_at_fpr_0_01, no
    # AUROC floor). Adding an unmeasured active profile fails this job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package (stdlib-only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Check shipped profiles against the measurement gate
        run: python scripts/check_measurement_gate.py --models-dir deepfake_lens/models

  qa-phase0:
    # Phase 0, WP-J: the QA harness runs the whole unit suite, folds the
    # results per QA ID (tests/qa/traceability.json) and regenerates
    # docs/CONFORMANCE.md; it exits 1 when any automated test fails or a
    # QA ID lacks exactly one canonical test. The extras the QA scenarios
    # exercise are installed (photo gate/face layer: numpy, Pillow, opencv;
    # audio: librosa/soundfile; API legs of QA-OUT-4 and G31: fastapi/httpx;
    # QA-IN-1 format samples: ffmpeg). No model weights.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # QA-SYS-10 checks that each deleted test's reason is in its
          # commit message; a shallow clone would skip that check.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install package with QA extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . numpy Pillow opencv-python-headless scipy librosa soundfile scikit-learn fastapi httpx jsonschema
      - name: QA harness (writes build/qa-logs and docs/CONFORMANCE.md)
        run: python scripts/qa_phase0.py --log-dir build/qa-logs --out docs/CONFORMANCE.md
      - name: Upload QA logs and conformance table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-phase0-conformance
          path: |
            build/qa-logs
            docs/CONFORMANCE.md
          if-no-files-found: error

  registry-links:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify cited URLs
        run: python scripts/check_registry_links.py

  dep-audit:
    # Vulnerability scan of the base install + declared extras. Hard gate:
    # a forensic tool must not ship with a known-vulnerable dependency,
    # even when the advisory lands upstream between two commits here —
    # the fix is bumping the minimum bound, not ignoring the failure.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package and pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pip-audit
      - name: Audit installed dependencies
        # --skip-editable: the local project is not published on PyPI, so
        # pip-audit cannot look it up and would fail on the package itself.
        run: pip-audit --strict --skip-editable

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepfake-lens"
version = "0.1.0"
description = "Local AI-generated media and text screening toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "YH" }]
keywords = ["deepfake", "ai-generated", "media-analysis", "local-scanner"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
pixel = ["opencv-python>=4.8", "numpy>=1.24"]
audio = ["librosa>=0.10", "numpy>=1.24", "scipy>=1.10"]
face = ["opencv-python>=4.8", "numpy>=1.24"]
# face.py uses the legacy mp.solutions.face_mesh API, which mediapipe
# removed in 0.10.30 (tasks-only builds) and in 1.x. mediapipe 0.10.x in
# turn requires numpy<2, which bounds opencv below the numpy-2-only 5.x
# line. Verified on mediapipe 0.10.14/0.10.21 + opencv 4.11 + numpy 1.26.
face_mediapipe = ["mediapipe>=0.10,<0.10.30", "opencv-python>=4.8,<5", "numpy>=1.24,<2"]
# Tasks-API FaceLandmarker path for tasks-only mediapipe builds (>=0.10.30 /
# 1.x) where mp.solutions no longer exists. Also needs the model asset —
# run scripts/fetch_facelandmarker.py or set DEEPFAKE_LENS_FACE_LANDMARKER.
face_tasks = ["mediapipe>=0.10.30", "opencv-python>=4.8", "numpy>=1.24"]
video = ["opencv-python>=4.8", "numpy>=1.24"]
ml = ["opencv-python>=4.8", "numpy>=1.24", "scikit-learn>=1.3"]
provenance = ["c2pa-python>=0.6"]
text_lm = ["torch>=2.0", "transformers>=4.40"]
# Pure-Python HWP/HWPX reader (MIT; sole dep olefile) for .hwp extraction.
# Without it .hwp files degrade to extractor=unavailable:syhwp.
hwp = ["syhwp>=0.0.7", "olefile>=0.46"]
# ECAPA-TDNN speaker verification for compare_speakers. Weights
# (~90 MB, speechbrain/spkrec-ecapa-voxceleb) download to ~/.cache on
# first use; m4a/aac/mp3 inputs also need ffmpeg for wav conversion.
# Without it, speaker comparison falls back to MFCC distance.
speaker = ["speechbrain>=1.0", "soundfile>=0.12", "torch>=2.1", "torchaudio>=2.1"]
# Pretrained SyncNet lip-sync for lipsync.py. syncnet-python calls the
# scenedetect 0.6 API (video_manager), which 0.7 removed — pin below 0.7.
# Also needs models/syncnet_v2.model + models/sfd_face.pth — run
# scripts/fetch_syncnet.py. Without it, lipsync falls back to the
# zero-asset envelope/mouth heuristic.
lipsync = ["syncnet-python>=0.2.2", "scenedetect>=0.6,<0.7", "torch>=2.0", "opencv-python>=4.8"]
# .zip/.tar extraction is stdlib-only; this extra adds .7z (py7zr) and
# .rar (rarfile — also needs an unrar/bsdtar binary on PATH). Without it
# those formats report a warning instead of failing.
archive = ["py7zr>=0.21", "rarfile>=4.1"]
full = ["librosa>=0.10", "opencv-python>=4.8", "numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3"]
dev = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "c2pa-python>=0.6",
  "coverage>=7.4",
]

[project.scripts]
deepfake-lens = "deepfake_lens.cli:main"

[tool.setuptools.packages.find]
include = ["deepfake_lens*"]
# Tests stay in the repo — the shipped wheel is a production artifact.
exclude = ["deepfake_lens.tests*"]

# GUI shell + extracted static assets must ship together — webapp.py serves
# gui.css/gui.js from the package directory.
[tool.setuptools.package-data]
deepfake_lens = ["gui.html", "gui.css", "gui.js", "models/*.json", "models/*.md", "models/*.xml"]

# Coverage gate: fail_under is set just below the measured floor (63.59%
# branch coverage with the dev extra installed, 2026-10 — down from 67% in
# 2026-09 as untested modules grew). CI enforces this floor in the extras job
# and a lower no-extras floor (53) in the base `python` job — optional-dep
# modules are largely uncovered without the extras installed. The test suite
# lives inside the measured package, so deepfake_lens/tests is omitted.
[tool.coverage.run]
source = ["deepfake_lens"]
omit = ["deepfake_lens/tests/*", "deepfake_lens/__main__.py"]
branch = true

[tool.coverage.report]
fail_under = 63
show_missing = true
skip_covered = false
exclude_also = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
  "@(abc\\.)?abstractmethod",
]

# Lint gate: true-positive rules only (syntax, undefined names, f-string
# placeholders, redefinitions, invalid escapes). Widening the rule set is a
# deliberate follow-up — keep CI green, not noisy.
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F821", "F541", "F811", "W605"]
# Fail-closed gate (phase 0, G1): blind `except Exception` (BLE001) and
# try/except/pass (S110) are errors in the four files on the verdict path.
# Ruff has no per-file *select*, so the rules are enabled globally and
# ignored everywhere except those files via a negated per-file pattern.
# A broad handler there must re-raise or log the traceback
# (logger.exception) — and record the failure in coverage/the payload.
extend-select = ["BLE001", "S110"]

[tool.ruff.lint.per-file-ignores]
"!deepfake_lens/{core,model_adapter,webapp_api,api_server}.py" = ["BLE001", "S110"]

# Gradual typing gate: the modules below were verified clean under mypy and
# must stay so. Add a file here only after it passes — widening the list is
